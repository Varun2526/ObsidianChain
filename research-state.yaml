  proxy_metric: "normalised AP (nAP), mean across 12 rolling-origin folds, dev-only"
  baseline_value: 0.5723   # RandomForest, protocol_2026_09_22 prior work
  best_value: 0.6155       # CORE+counterparty (exp08), INCONCLUSIVE not confirmed; 0.5914 is the confirmed tied-tier best
  total_runs: 12           # exp01, exp02, exp02b, exp03, exp04, exp05, exp06, exp07, exp08, exp09, exp11, exp12 (exp10 = artifact, not a metric run)
  trajectory: []
  # full records in experiments.jsonl; summarized in findings.md Optimization Trajectory

outer_loop:
  cycle: 4
  last_direction: broaden
  last_reflection: >
    Cycle 3 (this update) pivoted to a NEW axis per explicit user request:
    whether the dataset itself limits conclusions, and whether a
    purpose-built synthetic chain+network benchmark should exist. Found
    the infrastructure ALREADY EXISTS (src/obsidianchain/world/) but,
    investigated rigorously (exp11+exp12), is unsuitable AS CONFIGURED:
    a ceiling effect (exact nAP=1.0 regardless of feature set, including
    against its own hardest adversarial case) compounded by insufficient
    scale (3/12 usable folds). This is a BROADEN move, not a deepen of the
    PS-native model/feature axis - it answers a structural question about
    what this program CAN and CANNOT learn from available data, rather than
    extracting one more increment from the existing dataset. Also produced
    a genuine, concrete new pipeline-gap finding (Group E feature code is a
    stub) independent of the benchmark-suitability question. Direction for
    next cycle: either (a) return to DEEPEN on the PS-native axis (resolve
    H5 counterparty feature, H6 alert policy implication, wire TreeSHAP,
    train the real v2 artifact - all still open from cycle 2), or (b) if
    the user wants the network-layer question pursued further, the scoped
    next-generation-benchmark engineering task in
    16_synthetic_world_investigation.md is the well-evidenced starting
    point - NOT yet started, deliberately, given its scope and the lack of
    a forcing need. Holdout still untouched throughout.

