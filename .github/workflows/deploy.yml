name: Deploy ObsidianChain

# Deploys only a commit whose ci run on main succeeded (workflow_run), or on
# a manual dispatch. It used to deploy on every push, even when CI failed.
"on":
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      # The commit CI actually tested, not whatever main points at now.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      # A stopped instance, a changed public IP or a closed security group
      # used to surface only as a 30 s SSH timeout ending in "exit code 1".
      # Check port 22 first, retry briefly, and fail with a readable reason.
      - name: Check EC2 is reachable on port 22
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for i in $(seq 1 6); do
            if timeout 10 bash -c "</dev/tcp/${EC2_HOST}/22" 2>/dev/null; then
              echo "EC2 host reachable on port 22 (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: port 22 not reachable, retrying in 10 s"
            sleep 10
          done
          echo "::error title=EC2 unreachable::Port 22 on the EC2 host did not answer for about a minute. Check that the instance is running, that the EC2_HOST secret matches its current public IP (it changes after a stop/start unless an Elastic IP is attached), and that the security group allows SSH from GitHub Actions."
          exit 1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          # Connection timeout (default 30 s) and total script time (default
          # 10 min, too short for a cold build that regenerates vendor wheels).
          timeout: 60s
          command_timeout: 30m
          envs: DEPLOY_SHA
          script: |
            set -e

            cd ~/ObsidianChain

            echo "==> Checking out ${DEPLOY_SHA}"
            git fetch origin main
            git reset --hard "${DEPLOY_SHA}"

            echo "==> Detecting host architecture"
            ARCH=$(uname -m)
            case "$ARCH" in
              x86_64|amd64)
                PLATFORM="linux/amd64"
                VENDOR_PATH="vendor/linux-amd64"
                ;;
              aarch64|arm64)
                PLATFORM="linux/arm64"
                VENDOR_PATH="vendor/linux-arm64"
                ;;
              *)
                echo "ERROR: Unsupported host architecture: $ARCH" >&2
                exit 1
                ;;
            esac

            echo "Host architecture: $ARCH -> Platform: $PLATFORM"
            echo "Vendor path:       $VENDOR_PATH"

            echo "==> Preparing vendor dependencies for $PLATFORM"
            if ! make check-vendor PLATFORM="$PLATFORM"; then
              echo "==> Vendor dependencies missing; generating them"
              make vendor PLATFORM="$PLATFORM"
            fi

            echo "==> Building Docker image"
            docker build \
              --platform "$PLATFORM" \
              --network none \
              --build-arg VENDOR_PATH="$VENDOR_PATH" \
              -t obsidianchain:${DEPLOY_SHA} .

            echo "==> Detecting active deployment from Nginx"
            if grep -E '^[[:space:]]*proxy_pass[[:space:]]+http://127\.0\.0\.1:8080;' /etc/nginx/nginx.conf > /dev/null 2>&1; then
              ACTIVE_PORT="8080"
              ACTIVE_CONTAINER="obsidianchain"
              NEW_PORT="8081"
              NEW_CONTAINER="obsidianchain-new"
            elif grep -E '^[[:space:]]*proxy_pass[[:space:]]+http://127\.0\.0\.1:8081;' /etc/nginx/nginx.conf > /dev/null 2>&1; then
              ACTIVE_PORT="8081"
              ACTIVE_CONTAINER="obsidianchain-new"
              NEW_PORT="8080"
              NEW_CONTAINER="obsidianchain"
            else
              echo "ERROR: Unable to determine active upstream port from /etc/nginx/nginx.conf (expected 8080 or 8081)" >&2
              exit 1
            fi

            echo "Active: $ACTIVE_CONTAINER on $ACTIVE_PORT"
            echo "New:    $NEW_CONTAINER on $NEW_PORT"

            echo "==> Removing stale replacement container"
            docker rm -f "$NEW_CONTAINER" 2>/dev/null || true

            echo "==> Ensuring target port ${NEW_PORT} is free"
            CONFLICTING_CONTAINERS=$(docker ps -q --filter "publish=${NEW_PORT}")
            if [ -n "$CONFLICTING_CONTAINERS" ]; then
              echo "Removing container(s) holding port ${NEW_PORT}:"
              docker ps --filter "publish=${NEW_PORT}" --format "  - {{.Names}} ({{.ID}})"
              docker rm -f $CONFLICTING_CONTAINERS
            fi

            echo "==> Starting new container"
            docker run -d \
              --platform "$PLATFORM" \
              --name "$NEW_CONTAINER" \
              --restart unless-stopped \
              -p "127.0.0.1:${NEW_PORT}:8000" \
              obsidianchain:${DEPLOY_SHA} \
              serve --host 0.0.0.0 --port 8000

            echo "==> Waiting for health check"
            HEALTH_PASSED=0
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${NEW_PORT}/api/health" > /dev/null 2>&1; then
                echo "Health check passed on attempt $i"
                HEALTH_PASSED=1
                break
              fi
              sleep 2
            done

            if [ "$HEALTH_PASSED" -ne 1 ]; then
              echo "Health check FAILED after 30 attempts (60s)"
              docker logs "$NEW_CONTAINER" --tail 100 || true
              docker rm -f "$NEW_CONTAINER" 2>/dev/null || true
              exit 1
            fi

            echo "==> Switching Nginx to new container"
            sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak

            sudo sed -i \
              "s#proxy_pass http://127.0.0.1:${ACTIVE_PORT};#proxy_pass http://127.0.0.1:${NEW_PORT};#" \
              /etc/nginx/nginx.conf

            if ! grep -E "^[[:space:]]*proxy_pass[[:space:]]+http://127\.0\.0\.1:${NEW_PORT};" /etc/nginx/nginx.conf > /dev/null 2>&1 || \
               grep -E "^[[:space:]]*proxy_pass[[:space:]]+http://127\.0\.0\.1:${ACTIVE_PORT};" /etc/nginx/nginx.conf > /dev/null 2>&1; then
              echo "ERROR: Nginx configuration replacement failed or unexpected upstream state detected." >&2
              sudo cp /etc/nginx/nginx.conf.bak /etc/nginx/nginx.conf
              sudo rm -f /etc/nginx/nginx.conf.bak || true
              docker logs "$NEW_CONTAINER" --tail 100 || true
              docker rm -f "$NEW_CONTAINER" 2>/dev/null || true
              exit 1
            fi

            if ! sudo nginx -t; then
              echo "ERROR: Nginx configuration test failed. Restoring previous config." >&2
              sudo cp /etc/nginx/nginx.conf.bak /etc/nginx/nginx.conf
              sudo rm -f /etc/nginx/nginx.conf.bak || true
              docker logs "$NEW_CONTAINER" --tail 100 || true
              docker rm -f "$NEW_CONTAINER" 2>/dev/null || true
              exit 1
            fi

            if ! sudo systemctl reload nginx; then
              echo "ERROR: Failed to reload Nginx with new configuration. Restoring previous config." >&2
              sudo cp /etc/nginx/nginx.conf.bak /etc/nginx/nginx.conf
              if sudo nginx -t && sudo systemctl reload nginx; then
                echo "Successfully restored and reloaded previous Nginx configuration." >&2
                sudo rm -f /etc/nginx/nginx.conf.bak || true
                docker logs "$NEW_CONTAINER" --tail 100 || true
                docker rm -f "$NEW_CONTAINER" 2>/dev/null || true
                exit 1
              else
                echo "CRITICAL: Rollback reload failed! Preserving /etc/nginx/nginx.conf.bak and container '$NEW_CONTAINER' for manual recovery." >&2
                exit 1
              fi
            fi

            echo "==> Verifying production endpoint"
            PROD_PASSED=0
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1/api/health > /dev/null 2>&1; then
                PROD_PASSED=1
                break
              fi
              sleep 1
            done

            if [ "$PROD_PASSED" -ne 1 ]; then
              echo "ERROR: Production endpoint verification failed after Nginx switch. Rolling back." >&2
              sudo cp /etc/nginx/nginx.conf.bak /etc/nginx/nginx.conf
              if sudo nginx -t && sudo systemctl reload nginx; then
                echo "Successfully restored and reloaded previous Nginx configuration." >&2
                sudo rm -f /etc/nginx/nginx.conf.bak || true
                docker logs "$NEW_CONTAINER" --tail 100 || true
                docker rm -f "$NEW_CONTAINER" 2>/dev/null || true
                exit 1
              else
                echo "CRITICAL: Rollback reload failed after production verification failure! Preserving /etc/nginx/nginx.conf.bak and container '$NEW_CONTAINER' for manual recovery." >&2
                exit 1
              fi
            fi

            echo "==> Production endpoint verified successfully"

            echo "==> Removing old container: $ACTIVE_CONTAINER"
            if ! docker rm -f "$ACTIVE_CONTAINER"; then
              echo "WARNING: Failed to remove old container '$ACTIVE_CONTAINER'. Production traffic is healthy on new container, but manual container cleanup may be required." >&2
            fi

            echo "==> Cleaning up Nginx configuration backup"
            sudo rm -f /etc/nginx/nginx.conf.bak || true

            echo "==> Removing old image layers"
            docker image prune -f || true

            echo "==> Deployment successful"
