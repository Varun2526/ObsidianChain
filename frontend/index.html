<!doctype html>
<html lang="en" data-theme="dark" style="background:#0e0f11">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No remote stylesheet, no remote font. This application is built with
      --network none and deployed air-gapped; a Google Fonts <link> renders in
      fallback faces on a genuinely offline machine and leaks a request per
      page load on a connected one. IBM Plex is bundled from the pinned @fontsource packages
      (src/design/tokens.css), with system faces as the fallback. tests/test_frontend_offline.py fails if an
      external URL reappears in any frontend asset.
    -->
    <title>ObsidianChain</title>
    <meta name="description" content="ObsidianChain: blockchain investigation and risk intelligence" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
